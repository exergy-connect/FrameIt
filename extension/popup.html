<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exergy ∞ xFrame</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0f1419;
        --bg1: #1a2430;
        --text: #e8eef5;
        --muted: #9aafc2;
        --line: rgba(197, 218, 240, 0.18);
        --accent0: #c5daf0;
        --accent1: #5a8ec4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 320px;
        font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(165deg, var(--bg1), var(--bg0));
      }

      main {
        padding: 16px;
        display: grid;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img.logo {
        width: 44px;
        height: 44px;
        background: #fff;
      }

      .brand img.mark {
        width: 28px;
        height: 28px;
      }

      .brand-text {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .brand-text h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .brand-text p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }

      .marks {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }

      button {
        appearance: none;
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        color: var(--bg0);
        background: linear-gradient(120deg, var(--accent0), var(--accent1));
      }

      button:disabled {
        opacity: 0.65;
        cursor: default;
      }

      button.secondary {
        color: var(--text);
        background: rgba(197, 218, 240, 0.14);
        border: 1px solid var(--line);
      }

      button.danger {
        color: #f4f7fb;
        background: linear-gradient(120deg, #d96a6a, #b84242);
      }

      .active-session {
        display: grid;
        gap: 10px;
      }

      .active-session[hidden] {
        display: none;
      }

      .active-session__row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }

      .active-session__dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e25555;
        box-shadow: 0 0 0 0 rgba(226, 85, 85, 0.55);
        animation: frameit-pulse 1.4s ease-out infinite;
        flex-shrink: 0;
      }

      .active-session.is-paused .active-session__dot {
        background: #e0a84a;
        animation: none;
        box-shadow: none;
      }

      .active-session__time {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        font-size: 15px;
      }

      .active-session__actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .active-session__actions button {
        width: 100%;
      }

      @keyframes frameit-pulse {
        0% { box-shadow: 0 0 0 0 rgba(226, 85, 85, 0.55); }
        70% { box-shadow: 0 0 0 10px rgba(226, 85, 85, 0); }
        100% { box-shadow: 0 0 0 0 rgba(226, 85, 85, 0); }
      }

      .option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13px;
        line-height: 1.35;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .option input {
        margin: 2px 0 0;
        accent-color: var(--accent1);
        flex-shrink: 0;
      }

      .status {
        min-height: 1.2em;
        font-size: 12px;
        color: var(--muted);
      }

      .status.error {
        color: #f0a0a0;
      }

      .hint {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
        padding-top: 4px;
        border-top: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img
          class="logo"
          src="assets/exergy_connect_logo.png"
          alt="Exergy Connect"
          width="44"
          height="44"
        />
        <div class="brand-text">
          <h1>Exergy ∞ xFrame</h1>
          <p>Capture this tab’s web session</p>
        </div>
        <div class="marks">
          <img
            class="mark"
            src="assets/favicon.svg"
            alt=""
            width="28"
            height="28"
          />
        </div>
      </div>

      <label class="option" for="includeLogo">
        <input id="includeLogo" type="checkbox" checked />
        <span>Include Exergy logo in recording (top right)</span>
      </label>

      <label class="option" for="hideControls">
        <input id="hideControls" type="checkbox" checked />
        <span>Hide recording controls from the video</span>
      </label>

      <label class="option" for="includePointer">
        <input id="includePointer" type="checkbox" />
        <span>Include mouse pointer in recording</span>
      </label>

      <button id="start" type="button">Start session</button>

      <div id="activeSession" class="active-session" hidden>
        <div class="active-session__row">
          <span class="active-session__dot" aria-hidden="true"></span>
          <span id="activeTime" class="active-session__time">00:00</span>
        </div>
        <div class="active-session__actions">
          <button id="pause" type="button" class="secondary">Pause</button>
          <button id="stop" type="button" class="danger">Stop &amp; save</button>
        </div>
      </div>

      <div id="status" class="status" role="status"></div>
      <p class="hint">
        A 3-second countdown appears on the tab, then recording begins. If
        controls are hidden from the video, reopen this popup to pause or
        stop &amp; save.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
