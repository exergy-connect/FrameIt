name: Package Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build Chrome Web Store zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package extension zip
        id: pack
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          ASSET_NAME="exergy-frame-${VERSION}.zip"
          mkdir -p dist

          # Chrome Web Store expects manifest.json at the zip root.
          (
            cd extension
            zip -r -q "../dist/${ASSET_NAME}" . \
              -x "*.DS_Store" \
              -x "**/.DS_Store" \
              -x "*~" \
              -x "*/.git/*"
          )

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=dist/${ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

          echo "Created dist/${ASSET_NAME}"
          unzip -l "dist/${ASSET_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.asset_name }}
          path: ${{ steps.pack.outputs.asset_path }}
          archive: false
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.asset_path }}" \
            --clobber
